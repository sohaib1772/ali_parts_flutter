name: ali_parts_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.6+20

environment:
  sdk: ^3.9.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.6

  # WebView & Video Engine
  webview_flutter: ^4.10.0
  video_player: ^2.9.2

  # Networking & REST API
  dio: ^5.8.0+1
  retrofit: any
  json_annotation: ^4.9.0

  # Secure Storage & Fast Key-Value Storage
  flutter_secure_storage: ^9.2.4
  get_storage: ^2.1.1

  # Localization & Formatting
  intl: ^0.20.2

  # Connectivity & Store Compliance
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.2.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # UI Enhancements & Typography
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  iconsax_plus: ^1.0.0

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Firebase Push Notifications
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0

  # Supabase Realtime (live order & notification updates)
  realtime_client: ^2.4.0

  # Native Authentication & Deep Linking
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  app_links: ^6.3.2
  flutter_custom_tabs: ^2.1.0
  crypto: ^3.0.6
  youtube_explode_dart: ^3.1.0

  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: any
  retrofit_generator: any
  json_serializable: any
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A192F"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#0A192F"
  color_dark: "#0A192F"
  android_12:
    color: "#0A192F"
    icon_background_color: "#0A192F"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
